services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oboishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oboishop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oboishop_sklad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oboishop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
